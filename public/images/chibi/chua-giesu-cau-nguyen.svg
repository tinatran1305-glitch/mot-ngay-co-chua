<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" fill="none">
  <defs>
    <linearGradient id="bgPray" x1="0" y1="0" x2="600" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="50%" stop-color="#E0EFFA"/>
      <stop offset="100%" stop-color="#E1EFE6"/>
    </linearGradient>
    <radialGradient id="haloPray" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#FCD34D" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="420" rx="32" fill="url(#bgPray)"/>
  <!-- Soft clouds & sunbeams -->
  <circle cx="300" cy="175" r="125" fill="url(#haloPray)"/>
