  <path d="M150 95 L154 107 L166 111 L154 115 L150 127 L146 115 L134 111 L146 107 Z" fill="#FBBF24" opacity="0.8"/>
  <path d="M455 85 L458 94 L467 97 L458 100 L455 109 L452 100 L443 97 L452 94 Z" fill="#FBBF24" opacity="0.8"/>
