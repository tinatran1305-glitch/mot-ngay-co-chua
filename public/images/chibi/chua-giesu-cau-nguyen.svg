  <!-- Cross behind halo -->
  <path d="M300 96 V224 M236 160 H364" stroke="#FCD34D" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <!-- Hair back -->
  <path d="M242 155 C235 190 240 225 255 235 L345 235 C360 225 365 190 358 155 Z" fill="#6B4423"/>
