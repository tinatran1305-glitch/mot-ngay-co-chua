  <path d="M262 292 Q300 302 338 292" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>
  <!-- Head (Chibi gentle proportion) -->
  <circle cx="300" cy="164" r="50" fill="#FFE6D0" stroke="#E6C2A3" stroke-width="2"/>
  <!-- Hair front -->
  <path d="M248 155 C250 118 282 106 300 112 C318 106 350 118 352 155 C342 135 320 128 300 135 C280 128 258 135 248 155 Z" fill="#6B4423"/>
  <!-- Peaceful closed eyes in prayer -->
  <path d="M274 164 Q282 171 290 164" stroke="#5A381E" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M310 164 Q318 171 326 164" stroke="#5A381E" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Soft rosy cheeks -->
  <ellipse cx="268" cy="175" rx="8" ry="5" fill="#F4A298" opacity="0.55"/>
  <ellipse cx="332" cy="175" rx="8" ry="5" fill="#F4A298" opacity="0.55"/>
  <!-- Gentle beard & warm smile -->
  <path d="M254 176 Q300 222 346 176 Q338 205 300 212 Q262 205 254 176 Z" fill="#7D522D" opacity="0.85"/>
  <path d="M291 186 Q300 193 309 186" stroke="#5A381E" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Folded praying hands -->
  <path d="M286 268 C286 248 296 240 300 238 C304 240 314 248 314 268 Z" fill="#FFE6D0" stroke="#E6C2A3" stroke-width="2"/>
  <!-- White sleeves around hands -->
  <ellipse cx="282" cy="276" rx="18" ry="12" fill="#FFFFFF" stroke="#E8D7B4" stroke-width="2"/>
  <ellipse cx="318" cy="276" rx="18" ry="12" fill="#FFFFFF" stroke="#E8D7B4" stroke-width="2"/>
  <!-- Olive branches -->
  <path d="M180 340 Q210 310 240 330" stroke="#4F8A6B" stroke-width="3" stroke-linecap="round" fill="none"/>
  <ellipse cx="195" cy="322" rx="9" ry="5" transform="rotate(-25 195 322)" fill="#4F8A6B"/>
  <ellipse cx="215" cy="318" rx="9" ry="5" transform="rotate(15 215 318)" fill="#4F8A6B"/>
